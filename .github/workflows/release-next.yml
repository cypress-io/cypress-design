name: Release Next

on:
  workflow_call:
    inputs:
      nonce:
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Reinstall dependencies and regenerate build files
        run: |
          yarn install --immutable
        env:
          CI: true
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Set committer info
        ## attribute the commit to cypress-bot: https://github.community/t/logging-into-git-as-a-github-app/115916
        run: |
          git config --local user.email "${{ secrets.CYPRESS_BOT_APP_ID }}+cypress-bot[bot]@users.noreply.github.com"
          git config --local user.name "cypress-bot[bot]"

      ## npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10
      - name: Install npm with trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Set version numbers
        run: node scripts/set-version.mjs

      - name: Run pre-release process with changeset
        run: |
          yarn changeset pre enter next
          yarn changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM
        run: yarn changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the new tags
        run: git push --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
