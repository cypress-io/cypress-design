# voice.md, Product and feature names: product names are always capitalized,
# even in sentence-case text. Naming rules: "UI Coverage — never 'UI Code
# Coverage'". An error: none of these spellings is ordinary English. Feature
# names that are also everyday phrases live in FeatureNames.yml.
extends: substitution
message: "Use '%s' instead of '%s'."
link: https://design.cypress.io/agents/voice.md#product-and-feature-names
level: error
ignorecase: false
swap:
  'UI Code Coverage': UI Coverage
  '[Cc]ypress cloud|cypress Cloud': Cypress Cloud
  '[Cc]ypress app|cypress App': Cypress App
  '[Uu][Ii] coverage|ui Coverage': UI Coverage
