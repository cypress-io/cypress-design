# voice.md, Product and feature names: feature names are always capitalized,
# even in sentence-case text. Only multi-word names are listed: single words
# like "replay" or "insights" are also ordinary English.
# A warning, not an error: some of these are also everyday phrases ("branch
# review comments", "a test replay of the bug").
extends: substitution
message: "Use '%s' instead of '%s'."
link: https://design.cypress.io/agents/voice.md#product-and-feature-names
level: warning
ignorecase: false
swap:
  '[Tt]est replay|test Replay': Test Replay
  '[Ss]mart orchestration|smart Orchestration': Smart Orchestration
  '[Bb]ranch review|branch Review': Branch Review
  '[Cc]ypress studio|cypress Studio': Cypress Studio
  '[Ss]tudio ai|[Ss]tudio Ai': Studio AI
  '[Cc]loud mcp|[Cc]loud Mcp': Cloud MCP
