# voice.md, Naming rules: partner names keep their own branding, SSO and CI/CD
# are written in caps, and `cy.prompt` stays lowercase. An error: matching is
# case-sensitive and code spans are skipped, so lowercase URLs and identifiers
# don't trip it.
extends: substitution
message: "Use '%s' instead of '%s'."
link: https://design.cypress.io/agents/voice.md#naming-rules
level: error
ignorecase: false
swap:
  Github: GitHub
  Gitlab: GitLab
  BitBucket: Bitbucket
  JIRA: Jira
  '[Cc]i/[Cc]d|CI/cd|ci/CD': CI/CD
  '[Ss]so': SSO
  'Cy\.[Pp]rompt': cy.prompt
