StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Cypress

# These files define the rules, so they quote the banned terms as examples
[.agents/voice.md]
BasedOnStyles =

[.agents/review-checklist.md]
Cypress.Hype = NO
Cypress.Just = NO

# An image-generation prompt: "seamlessly" means "no visible seam", not hype
[.agents/illustrations.md]
Cypress.Hype = NO

# Mostly symlinks to .agents/skills, which is already linted; the rest are
# agent prompts, not reader-facing prose
[.claude/commands/*.md]
BasedOnStyles =
